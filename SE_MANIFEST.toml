# ============================================================
# SE_MANIFEST.toml (Repository Intent, Scope, and Role)
# ============================================================

schema = "se-manifest-1"
schema_url = "https://github.com/structural-explainability/spec-se/blob/main/manifests/se-manifest-1.md"

[meta]
# Non-normative contextual information
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
framework_note = "Provides definitions and conventions for SE_MANIFEST semantics."
description = "Declarative claim of repository intent, scope, and role."
purpose = "To make explicit the boundaries, responsibilities, and expectations of this repository relative to others."
keywords_note = "Keywords live only in CITATION.cff (canonical)."

[repo]
name = "applied-computing-foundations"
org = "denisecase"
kind = "software"
status = "academic"
since = "2026"
summary = "Foundational, cross-cutting computing skills for file systems, terminals, shells, and text processing."

[layer]
space = "Computing Foundations"
role = "post-secondary-education"

[depends]
# WHY: This repository is documentation-only (MkDocs hosted on GitHub Pages).
#      No tools are required to consume the content.
required = []
# WHY: Optional tools are not required to use or run the repository.
optional = [
  "git",
  "mkdocs",
  "python>=3.14",
]

[provides]
artifacts = [
    "ANNOTATIONS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "docs",
]

[scope]
includes = [
    "use terminal and shell for basic navigation",
    "view hidden files and directories",
    "view and interpret file extensions",
    "understand hierarchical file system structure",
    "create and organize a local repositories directory",
]
excludes = [
    "programming or scripting",
    "data analytics",
    "statistical modeling",
    "software package development",
]

[citation]
cff = "CITATION.cff"
preferred = "repo"
bib_hint = "case2026-applied-computing-foundations"

[traceability]
identifier_map = "none"
